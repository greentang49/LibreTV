var v=document.getElementById('v'),hls=null,nowEl=document.getElementById('now'),errEl=document.getElementById('err');
window.addEventListener('message',function(e){if(e.data==='shell:hide'){if(hls)try{hls.stopLoad()}catch(x){}}else if(e.data==='shell:show'){if(hls)try{hls.startLoad()}catch(x){}}});
var ov=document.getElementById('bigplay');
function showOv(){ov.style.display='flex'}
function hideOv(){ov.style.display='none'}
ov.onclick=function(){var pr=v.play();if(pr&&pr.catch)pr.catch(function(){v.muted=true;v.play().catch(function(){})})};
v.addEventListener('playing',hideOv);
function tryPlay(){
  var pr=v.play();
  if(pr&&pr.catch)pr.catch(function(){
    v.muted=true;
    var pr2=v.play();
    if(pr2&&pr2.catch)pr2.catch(function(){showOv()});
  });
}

function play(name,url,btn){
  document.querySelectorAll('button.ch').forEach(function(b){b.classList.remove('active')});
  if(btn)btn.classList.add('active');
  nowEl.textContent='正在播放：'+name; errEl.style.display='none'; hideOv();
  if(hls){hls.destroy();hls=null}
  if(v.canPlayType('application/vnd.apple.mpegurl')){v.src=url;tryPlay();return}
  if(Hls.isSupported()){
    hls=new Hls({liveSyncDurationCount:3});
    hls.loadSource(url);hls.attachMedia(v);
    hls.on(Hls.Events.MANIFEST_PARSED,function(){tryPlay()});
    hls.on(Hls.Events.ERROR,function(e,d){if(d&&d.fatal){errEl.style.display='block'}});
  }else{errEl.style.display='block'}
}
var grid=document.getElementById('grid');
CHANNELS.forEach(function(c){
  var b=document.createElement('button');b.className='ch';b.textContent=c[0];
  b.onclick=function(){play(c[0],c[1],b)};grid.appendChild(b);
});
